name: mms
description: "MMS project "

publish_to: 'none'

version: 1.0.0+2.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  drawable_text: ^1.0.2

  m_cubit:
    #    path: ../../packages/m_cubit
    git:
      url: https://github.com/saedAlHanash/m_cubit

  image_multi_type: ^1.0.6

  native_plugin:
    path: ./packages/native_plugin

  group_button: ^5.3.4
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.1.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  logger: ^2.8.0
  dropdown_button2: ^3.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  intl: ^0.20.2
  collection: ^1.19.1
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^10.2.2
  hive: ^2.2.3
  awesome_dialog: ^3.3.0
  hive_flutter: ^1.1.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.5
  table_calendar: ^3.2.0
  crypto:
  fl_chart: ^1.3.0
  pull_to_refresh: ^2.0.0
  livekit_client: ^2.13.2
  flutter_background: ^1.3.1
  device_info_plus:
  pip: ^0.0.4
  animated_tree_view: ^2.3.0
  signalr_netcore: ^1.4.4
  go_router: ^18.1.4
  mobile_scanner: ^7.5.0
  file_picker: ^13.4.1
  qr_flutter: ^4.1.0

dependency_overrides:
  awesome_dialog: 3.2.1
  dropdown_button2: ^2.3.9

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/
  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo.ttf
          weight: 400
        - asset: assets/fonts/cairo_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/cairo_bold.ttf
          weight: 700

flutter_intl:
  enabled: true
